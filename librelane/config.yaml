meta:
  version: 3
  flow: ClassicWithPadframeBridge

DESIGN_NAME: wrapper_top

VERILOG_FILES:
  - dir::../src/B18_top.sv

FP_DEF_TEMPLATE: "dir::../def/A/B18_A.def"

CLOCK_PORT: clk
CLOCK_NET: clk
CLOCK_PERIOD: 200   # 5 MHz

# Routing / ESD
DIODE_ON_PORTS: in

# Let the tool size the core
FP_SIZING: absolute
FP_CORE_UTIL: 10
PL_TARGET_DENSITY_PCT: 55

DESIGN_REPAIR_MAX_SLEW_PCT: 10
DESIGN_REPAIR_MAX_CAP_PCT: 10

# Synthesis strategy
SYNTH_STRATEGY: "DELAY 2"
SYNTH_HIERARCHY_MODE: keep
USE_SLANG: true
ERROR_ON_XOR_ERROR: false

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
PL_TIME_DRIVEN: False
PL_ROUTABILITY_DRIVEN: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"
- "analog_block"

KLAYOUT_XOR_IGNORE_LAYERS:
  - "0/0"

# 3.3V Standard Cell
DEFAULT_CORNER: nom_tt_025C_3v30
STA_CORNERS:
  - nom_tt_025C_3v30
  - min_ff_n40C_3v60
  - max_ss_125C_3v00

LIB:
  "*_tt_025C_3v30":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib
  "*_ss_125C_3v00":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib
  "*_ff_n40C_3v60":
    - /foss/pdks/gf180mcuD/libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib

# Route congestion
GRT_ALLOW_CONGESTION: false
RT_MAX_LAYER: Metal4

# Placement
MAX_FANOUT_CONSTRAINT: 8
GPL_CELL_PADDING: 2
DPL_CELL_PADDING: 2

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 10
DRT_ANTENNA_REPAIR_MARGIN: 10 # %
PL_MAX_DISPLACEMENT_X: 800
PL_MAX_DISPLACEMENT_Y: 500

# Optional: keep power nets (good practice)
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

# Disable core ring pad connection & enable seal ring
PDN_CORE_RING: True
PDN_CORE_RING_CONNECT_TO_PADS: False

DIE_AREA: [0, 0, 1110, 1110]
CORE_AREA: [100, 100, 1010, 1010]

# PDN - Straps
PDN_VWIDTH: 5
PDN_HWIDTH: 4
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 75
PDN_HPITCH: 75

# PDN - Core ring
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 25
PDN_CORE_RING_HWIDTH: 25
PDN_ENABLE_PINS: True
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Halo around macros for row-cutting and for the PDN macro grid
FP_MACRO_HORIZONTAL_HALO: 10
FP_MACRO_VERTICAL_HALO: 10
PDN_HORIZONTAL_HALO: 5
PDN_VERTICAL_HALO: 5

# Pin allocation
# "IO_PIN_ORDER_CFG": "dir::pin_order.cfg"
"ERRORS_ON_UNMATCHED_IO": "both"

PDN_CFG: dir::pdn_cfg.tcl

# DRC options block containing worker count
KLAYOUT_DRC_OPTIONS:
  feol: true
  beol: true
  run_mode: "deep"
  conn_drc: true
  dummy: true
  dummy_no_sub_prev: true
  offgrid: true
  wedge: true
  decks: "all,-antenna,-density,-cup"
  variant: ref::$PDK
  workers: max

KLAYOUT_DENSITY_OPTIONS:
  decks: "density"
  variant: ref::$PDK
  workers: max

KLAYOUT_ANTENNA_OPTIONS:
  decks: "antenna"
  variant: ref::$PDK
  workers: max

MAGIC_EXT_UNIQUE: notopports