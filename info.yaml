# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "Auto Aligner"             # Project title (e.g. "Simple CPU", "PLL", "ADC")
  team: "B18 - Probton"                      # Your Team name
  discord: "timlam0531"                   # Optional: Discord username (for support / communication)
  description: "Dithering Auto Aligner Processor"  # Short one-line description
  lvs_config: "lvs/lvs_config.json"

# Bottom left to Upper left to Upper right (1/4 of 2.235μm x 2.235μm)
pins:
  # ===== Digital =====
  # === West ===
  # 1
  - name: VDD
    io_type: power
    secondary_esd: false

  # 2
  - name: rst_n
    io_type: input_schmitt
    secondary_esd: false

  # 3
  - name: spi_cs_n
    io_type: input_schmitt
    secondary_esd: false

  # 4
  - name: spi_sclk
    io_type: input_cmos
    secondary_esd: false

  # 5
  - name: spi_mosi
    io_type: input_schmitt
    secondary_esd: false

  # 6
  - name: spi_miso
    io_type: bidirectional_24ma
    secondary_esd: false

  # 7
  - name: clk
    io_type: input_cmos
    secondary_esd: false

  # 8
  - name: move_en_x
    io_type: bidirectional_24ma
    secondary_esd: false

  # 9
  - name: dir_x
    io_type: bidirectional_24ma
    secondary_esd: false

  # 10
  - name: ref_wave_x
    io_type: bidirectional_24ma
    secondary_esd: false

  # 11
  - name: mems_drv_x
    io_type: bidirectional_24ma
    secondary_esd: false

  # === North ===
  # 12 (1)
  - name: mems_drv_y
    io_type: bidirectional_24ma
    secondary_esd: false

  # 13 (2)
  - name: ref_wave_y
    io_type: bidirectional_24ma
    secondary_esd: false

  # 14 (3)
  - name: dir_y
    io_type: bidirectional_24ma
    secondary_esd: false

  # 15 (4)
  - name: move_en_y
    io_type: bidirectional_24ma
    secondary_esd: false

  # 16 (5)
  - name: VSS
    io_type: ground
    secondary_esd: false

  # ===== Analog =====

  # 17 (6)
  # Virtual Pin

  # 18 (7)
  - name: analog_error_x_output
    io_type: analog
    secondary_esd: true

  # 19 (8)
  - name: analog_readout_input
    io_type: analog
    secondary_esd: true

  # 20 (9)
  - name: analog_readout_output
    io_type: analog
    secondary_esd: true

  # 21 (10)
  - name: analog_error_y_output
    io_type: analog
    secondary_esd: true

  # 22 (11)
  # Virtual Pin